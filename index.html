<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tosta | توستا - تجربة الشكل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background-color: #050505;
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
    }
    .glow-gold {
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6), 0 0 30px rgba(212, 175, 55, 0.3);
    }
    .glow-red {
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
    }
    .border-gold-glow {
      border: 1.5px solid #d4af37;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
    }
    .btn-red-neon {
      background-color: #ff0000;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1.2rem;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-red-neon:hover {
      background-color: #cc0000;
      box-shadow: 0 0 35px rgba(255, 0, 0, 1);
      transform: scale(1.05);
    }
    .btn-gold-outline {
      background: transparent;
      border: 2px solid #d4af37;
      color: #d4af37;
      font-weight: bold;
      padding: 0.4rem 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
      transition: 0.3s;
      cursor: pointer;
    }
    .btn-gold-outline:hover {
      background-color: #d4af37;
      color: #050505;
      box-shadow: 0 0 25px #d4af37;
    }
    .tab-active {
      background-color: #ff0000;
      color: white;
      box-shadow: 0 0 25px #ff0000;
      border-bottom: 3px solid #d4af37;
      font-weight: bold;
    }
    .tab-inactive {
      background-color: #1a1a1a;
      color: #d4af37;
      border: 1px solid #d4af37;
    }
    .floating-cart {
      backdrop-filter: blur(12px);
      background-color: rgba(10, 10, 10, 0.9);
      border: 1.5px solid #d4af37;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
    }
    .popup-overlay {
      background-color: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
    }
    ::-webkit-scrollbar {
      width: 6px;
      background: #050505;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Sticky Navbar -->
  <header class="sticky top-0 z-50 bg-black bg-opacity-90 backdrop-blur-md border-b border-gold-glow">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fas fa-crown text-3xl text-[#d4af37] glow-gold rounded-full"></i>
        <span class="text-2xl md:text-3xl font-extrabold text-[#d4af37] tracking-wider glow-gold">TOSTA</span>
      </div>
      <div class="flex items-center gap-2 md:gap-3">
        <button id="cartToggleBtn" class="relative btn-gold-outline text-sm px-3 py-1.5">
          <i class="fas fa-shopping-cart ml-1"></i> <span class="hidden sm:inline">السلة</span>
          <span id="cartCountBadge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold glow-red">0</span>
        </button>
      </div>
    </div>
    <nav class="max-w-7xl mx-auto px-2 pb-2 flex overflow-x-auto gap-1 md:gap-2 text-sm">
      <button class="tab-active whitespace-nowrap px-4 py-2 rounded-full transition">كريب</button>
      <button class="tab-inactive whitespace-nowrap px-4 py-2 rounded-full transition">بيتزا</button>
      <button class="tab-inactive whitespace-nowrap px-4 py-2 rounded-full transition">فطير</button>
      <button class="tab-inactive whitespace-nowrap px-4 py-2 rounded-full transition">وجبات</button>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 py-6 pb-36">
    <h2 class="text-3xl font-bold text-[#d4af37] mb-6 text-center glow-gold">🍢 ركن الكريب (عادي / كونو)</h2>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      
      <!-- Card Product -->
      <div class="bg-[#111] border-gold-glow rounded-2xl p-4 hover:scale-[1.02] transition-transform duration-300">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-xl font-bold text-[#d4af37]">بطاطس</h3>
          <span class="text-sm bg-[#1a1a1a] text-gray-400 px-2 py-1 rounded">عادي / كونو</span>
        </div>
        <div class="flex justify-between items-center mb-3">
          <span class="text-2xl font-extrabold text-white">60 <small class="text-sm text-gray-400">ج</small></span>
          <span class="text-lg text-gray-400">/</span>
          <span class="text-2xl font-extrabold text-white">70 <small class="text-sm text-gray-400">ج</small></span>
        </div>
        <button onclick="addToCart('بطاطس', 60, 'عادي')" class="btn-red-neon w-full text-center py-2">
          <i class="fas fa-plus ml-1"></i> أضف للسلة
        </button>
      </div>
      
    </div>
  </main>

  <!-- Floating Cart -->
  <div id="floatingCart" class="fixed bottom-6 left-4 right-4 md:left-auto md:right-6 md:w-96 floating-cart rounded-2xl p-4 z-40 hidden">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xl font-bold text-[#d4af37]">🛒 سلة المشتريات</h3>
      <button id="closeCartBtn" class="text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItemsList" class="max-h-52 overflow-y-auto space-y-2 text-sm mb-3">
      <p class="text-gray-500 text-center">السلة فارغة</p>
    </div>
    <div class="flex justify-between text-lg font-bold text-white border-t border-[#d4af37] pt-2">
      <span>الإجمالي:</span>
      <span id="cartTotalPrice">0 ج</span>
    </div>
    <button id="checkoutBtn" class="btn-red-neon w-full mt-3 text-center py-2.5" disabled>تأكيد الطلب</button>
  </div>

  <!-- Checkout Popup -->
  <div id="checkoutPopup" class="fixed inset-0 z-50 flex items-center justify-center popup-overlay hidden">
    <div class="bg-[#111] border border-gold-glow rounded-2xl p-6 w-11/12 max-w-md glow-gold">
      <h2 class="text-2xl font-bold text-[#d4af37] mb-4 text-center">إتمام الطلب</h2>
      <div class="space-y-3">
        <input type="text" id="custName" placeholder="الاسم الكريم" class="w-full bg-[#1a1a1a] border border-gray-600 rounded p-3 text-white focus:border-[#d4af37] outline-none">
        <input type="tel" id="custPhone" placeholder="رقم الموبايل" class="w-full bg-[#1a1a1a] border border-gray-600 rounded p-3 text-white focus:border-[#d4af37] outline-none">
        <textarea id="custAddress" rows="2" placeholder="العنوان بالتفصيل" class="w-full bg-[#1a1a1a] border border-gray-600 rounded p-3 text-white focus:border-[#d4af37] outline-none"></textarea>
      </div>
      <div class="flex gap-3 mt-5">
        <button id="closePopupBtn" class="flex-1 btn-gold-outline py-2">إلغاء</button>
        <button id="sendWhatsAppBtn" class="flex-1 btn-red-neon py-2">إرسال للواتساب</button>
      </div>
    </div>
  </div>

  <script>
    // Cart functionality
    let cart = [];
    
    function updateCartUI() {
      const cartList = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalPrice');
      const countBadge = document.getElementById('cartCountBadge');
      const checkoutBtn = document.getElementById('checkoutBtn');
      
      if (cart.length === 0) {
        cartList.innerHTML = '<p class="text-gray-500 text-center">السلة فارغة</p>';
        totalSpan.textContent = '0 ج';
        countBadge.textContent = '0';
        checkoutBtn.disabled = true;
        checkoutBtn.classList.add('opacity-50');
        return;
      }
      
      let total = 0;
      cartList.innerHTML = cart.map((item, index) => {
        total += item.price;
        return `
          <div class="flex justify-between items-center bg-[#1a1a1a] p-2 rounded text-white">
            <span>${item.name} <small class="text-gray-400">(${item.type})</small></span>
            <div class="flex items-center gap-2">
              <span class="text-[#d4af37] font-bold">${item.price} ج</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
      
      totalSpan.textContent = total + ' ج';
      countBadge.textContent = cart.length;
      checkoutBtn.disabled = false;
      checkoutBtn.classList.remove('opacity-50');
    }
    
    function addToCart(name, price, type = 'عادي') {
      cart.push({ name, price, type });
      updateCartUI();
      document.getElementById('floatingCart').classList.remove('hidden');
    }
    
    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }
    
    // Cart toggle
    document.getElementById('cartToggleBtn').addEventListener('click', () => {
      document.getElementById('floatingCart').classList.toggle('hidden');
    });
    
    document.getElementById('closeCartBtn').addEventListener('click', () => {
      document.getElementById('floatingCart').classList.add('hidden');
    });
    
    // Checkout popup
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      document.getElementById('checkoutPopup').classList.remove('hidden');
    });
    
    document.getElementById('closePopupBtn').addEventListener('click', () => {
      document.getElementById('checkoutPopup').classList.add('hidden');
    });
    
    // WhatsApp send
    document.getElementById('sendWhatsAppBtn').addEventListener('click', () => {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      
      if (!name || !phone || !address) {
        alert('من فضلك أكمل جميع البيانات');
        return;
      }
      
      let orderDetails = cart.map((item, i) => `${i+1}. ${item.name} (${item.type}) - ${item.price} ج`).join('%0A');
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      
      let message = `🚀 *طلب جديد من TOSTA*%0A%0A` +
                    `👤 *الاسم:* ${name}%0A` +
                    `📞 *الموبايل:* ${phone}%0A` +
                    `📍 *العنوان:* ${address}%0A%0A` +
                    `📋 *تفاصيل الطلب:*%0A${orderDetails}%0A%0A` +
                    `💰 *الإجمالي النهائي:* ${total} ج`;
      
      window.open(`https://wa.me/201030353060?text=${message}`, '_blank');
    });
  </script>
</body>
</html>
