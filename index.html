<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دكتور جابر شحاتة | مختبر تحاليل طبية</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/822/822118.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #121212; --card-bg: #1e1e1e; --primary: #2ecc71; --text: #e0e0e0; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); margin: 0; padding-bottom: 160px; color: var(--text); overflow-x: hidden; }
        
        /* القائمة الجانبية */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 1001; top: 0; right: 0; background-color: #111; overflow-x: hidden; transition: 0.2s ease-out; padding-top: 60px; border-left: 2px solid var(--primary); }
        .sidebar a { padding: 15px 25px; text-decoration: none; font-size: 18px; color: #bbb; display: block; text-align: right; border-bottom: 1px solid #222; cursor: pointer; }
        .menu-icon { font-size: 25px; cursor: pointer; color: var(--primary); position: absolute; top: 20px; right: 20px; z-index: 1000; background: var(--card-bg); padding: 10px; border-radius: 10px; }

        /* الهيدر */
        .header { background: linear-gradient(180deg, #1e1e1e, #121212); padding: 60px 20px 40px; text-align: center; border-bottom: 2px solid var(--primary); }
        .doc-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 26px; }

        .container { max-width: 550px; margin: 20px auto; padding: 0 15px; }

        /* صندوق الرسائل الجديد */
        .message-box { background: var(--card-bg); border-radius: 15px; padding: 20px; margin-top: 40px; border: 1px solid var(--primary); }
        .message-box h3 { color: var(--primary); margin-top: 0; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: #fff; box-sizing: border-box; font-family: inherit; }
        .send-msg-btn { width: 100%; background: var(--primary); color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .send-msg-btn:hover { opacity: 0.9; }

        /* التحاليل الـ 40 */
        .cat-box { margin-top: 30px; }
        .cat-name { color: var(--primary); border-right: 3px solid var(--primary); padding-right: 12px; margin-bottom: 15px; font-weight: bold; }
        .test-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .order-btn { background: var(--primary); color: #000; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        
        /* شريط التواصل */
        .footer-nav { position: fixed; bottom: 20px; left: 5px; right: 5px; display: flex; gap: 5px; z-index: 999; }
        .footer-nav a { flex: 1; background: var(--primary); color: #000; text-align: center; padding: 10px 2px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .footer-nav a.fb { background: #1877f2; color: #fff; }
        .footer-nav a.yt { background: #ff0000; color: #fff; }

        .copyright { text-align: center; margin-top: 40px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div id="mySidebar" class="sidebar">
  <a href="javascript:void(0)" onclick="closeNav()" style="font-size: 30px; color: var(--primary);">×</a>
  <a onclick="closeNav()">عن المعمل</a>
  <a onclick="closeNav()">خبرة الدكتور</a>
  <a onclick="closeNav()">التحاليل الموجودة</a>
  <a onclick="closeNav()">أهم النصائح</a>
</div>

<span class="menu-icon" onclick="openNav()"><i class="fas fa-bars"></i></span>

<div class="header">
    <img src="doctor.jpg" class="doc-img" alt="دكتور جابر">
    <h1>دكتور جابر شحاتة</h1>
    <p>أبو المطامير - مساكن الإرشاد</p>
</div>

<div class="container">
    <div class="cat-box">
        <div class="cat-name">🧬 تحاليل الدم والمناعة</div>
        <div class="test-card"><h4>صورة دم كاملة (CBC)</h4><a href="https://wa.me/201015090991?text=CBC" class="order-btn">اطلب</a></div>
        <div class="test-card"><h4>سرعة الترسيب (ESR)</h4><a href="https://wa.me/201015090991?text=ESR" class="order-btn">اطلب</a></div>
        </div>

    <div class="message-box">
        <h3>📩 أرسل شكواك أو استفسارك</h3>
        <div class="input-group">
            <input type="text" id="patientName" placeholder="اسم حضرتك">
        </div>
        <div class="input-group">
            <textarea id="patientMessage" rows="4" placeholder="اكتب استفسارك أو شكواك هنا للدكتور..."></textarea>
        </div>
        <button class="send-msg-btn" onclick="sendToDoctor()">إرسال للدكتور عبر واتساب</button>
    </div>

    <div class="copyright">
        © 2026 Designed by <b>Eng Ahmad Gaber</b>
    </div>
</div>

<div class="footer-nav">
    <a href="https://wa.me/201015090991"><i class="fab fa-whatsapp"></i>واتساب</a>
    <a href="tel:01015090991"><i class="fas fa-phone-alt"></i>اتصل بنا</a>
    <a href="https://www.facebook.com/share/1Ajnuq8VBe/" target="_blank" class="fb"><i class="fab fa-facebook-f"></i>فيسبوك</a>
    <a href="https://youtube.com/@drgaber2023?si=RRa9kT9aUIvf3amP" target="_blank" class="yt"><i class="fab fa-youtube"></i>يوتيوب</a>
    <a href="#"><i class="fas fa-map-marker-alt"></i>موقعنا</a>
</div>

<script>
function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

function sendToDoctor() {
    const name = document.getElementById('patientName').value;
    const msg = document.getElementById('patientMessage').value;
    if(!name || !msg) { alert("برجاء كتابة الاسم والرسالة"); return; }
    const fullMsg = `الاسم: ${name}%0Aالشكوى: ${msg}`;
    window.open(`https://wa.me/201015090991?text=${fullMsg}`, '_blank');
}
</script>

</body>
</html>
