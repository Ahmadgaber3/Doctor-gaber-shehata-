<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOSTA | مطعم توستا - الفخامة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --red-neon: #ff0000; --dark: #050505; --card: #121212; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--dark); color: #fff; margin: 0; }
        
        /* انيميشن الانفجار اللوني */
        .header { padding: 40px 20px; text-align: center; border-bottom: 3px solid var(--gold); background: radial-gradient(circle, #3d0000 0%, var(--dark) 100%); }
        .logo-box { border: 4px solid var(--gold); display: inline-block; padding: 10px; border-radius: 20px; box-shadow: 0 0 20px var(--red-neon); }
        .res-name { font-size: 35px; color: var(--gold); text-shadow: 2px 2px 5px #000; margin: 15px 0 5px; }

        /* سلة المشتريات الذهبية */
        .cart-icon { position: fixed; bottom: 30px; left: 30px; background: linear-gradient(45deg, var(--gold), #ffcc00); color: #000; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2000; box-shadow: 0 0 20px var(--gold); cursor: pointer; border: 2px solid #fff; }
        #cart-count { position: absolute; top: 0; right: 0; background: var(--red-neon); color: white; padding: 3px 8px; border-radius: 50%; font-size: 14px; }

        /* التبويبات */
        .tabs-container { display: flex; overflow-x: auto; background: #000; padding: 10px; sticky: top; top: 0; z-index: 1000; border-bottom: 1px solid var(--gold); }
        .tab { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 20px; margin: 0 5px; border-radius: 30px; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .tab.active { background: var(--red-neon); color: #fff; border-color: var(--red-neon); box-shadow: 0 0 10px var(--red-neon); }

        /* كروت الطعام الفخمة */
        .container { padding: 20px; }
        .category-header { color: var(--gold); border-right: 5px solid var(--red-neon); padding-right: 15px; margin: 30px 0 20px; }
        .food-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #222; position: relative; overflow: hidden; }
        .food-card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--gold); }
        .food-name { font-size: 20px; color: var(--gold); margin-bottom: 15px; display: block; }
        
        .price-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; }
        .btn-add { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .btn-add:hover { border-color: var(--gold); background: #222; }
        .btn-add span { display: block; color: var(--red-neon); font-weight: bold; font-size: 16px; margin-top: 5px; }

        /* المودال (صفحة الطلب) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; padding: 20px; overflow-y: auto; }
        .modal-body { max-width: 500px; margin: auto; background: #111; padding: 25px; border-radius: 25px; border: 2px solid var(--gold); }
        .input-style { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .confirm-btn { background: var(--red-neon); color: #fff; width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px var(--red-neon); }
    </style>
</head>
<body>

<div class="cart-icon" onclick="openCart()">
    <i class="fas fa-shopping-basket fa-lg"></i>
    <span id="cart-count">0</span>
</div>

<div class="header">
    <div class="logo-box"><h1 style="margin:0; color:var(--gold);">TOSTA</h1></div>
    <h2 class="res-name">مطعم توستا</h2>
    <p style="color:var(--gold); letter-spacing: 2px;">الأكل بشكل تاني</p>
</div>

<div class="tabs-container">
    <button class="tab active" onclick="scrollToCat('crepe')">الكريب الحادق</button>
    <button class="tab" onclick="scrollToCat('pizza')">ركن البيتزا</button>
    <button class="tab" onclick="scrollToCat('meals')">الوجبات والبروست</button>
    <button class="tab" onclick="scrollToCat('sweet')">الفطير الحلو</button>
</div>

<div class="container">
    <div id="crepe">
        <h2 class="category-header">🌯 كريب حادق (عادي / كونو)</h2>
        <div class="food-card">
            <span class="food-name">كريب بطاطس</span>
            <div class="price-row">
                <button class="btn-add" onclick="buy('كريب بطاطس عادي', 60)">عادي <span>60ج</span></button>
                <button class="btn-add" onclick="buy('كريب بطاطس كونو', 70)">كونو <span>70ج</span></button>
            </div>
        </div>
        <div class="food-card">
            <span class="food-name">كريب ميكس لحوم</span>
            <div class="price-row">
                <button class="btn-add" onclick="buy('ميكس لحوم عادي', 95)">عادي <span>95ج</span></button>
                <button class="btn-add" onclick="buy('ميكس لحوم كونو', 115)">كونو <span>115ج</span></button>
            </div>
        </div>
    </div>

    <div id="pizza">
        <h2 class="category-header">🍕 ركن البيتزا (4 أحجام)</h2>
        <div class="food-card">
            <span class="food-name">بيتزا مارجريتا</span>
            <div class="price-row">
                <button class="btn-add" onclick="buy('مارجريتا S', 70)">S <span>70ج</span></button>
                <button class="btn-add" onclick="buy('مارجريتا M', 80)">M <span>80ج</span></button>
                <button class="btn-add" onclick="buy('مارجريتا L', 90)">L <span>90ج</span></button>
                <button class="btn-add" onclick="buy('مارجريتا XL', 100)">XL <span>100ج</span></button>
            </div>
        </div>
    </div>
</div>

<div id="cartModal" class="modal">
    <div class="modal-body">
        <button onclick="openCart()" style="background:none; color:var(--red-neon); border:none; float:left; font-size:20px;">X</button>
        <h2 style="color:var(--gold); text-align:center;">🛒 فاتورتك من توستا</h2>
        <div id="cartItems" style="margin:20px 0; border-bottom:1px solid #333; padding-bottom:10px;"></div>
        <div style="text-align:center; font-size:22px; margin-bottom:20px;">الإجمالي: <span id="total" style="color:var(--gold)">0</span> ج</div>
        
        <input type="text" id="uName" class="input-style" placeholder="اسمك يا بطل">
        <input type="tel" id="uPhone" class="input-style" placeholder="رقم الموبايل">
        <textarea id="uAddr" class="input-style" rows="3" placeholder="العنوان بالتفصيل"></textarea>
        
        <button class="confirm-btn" onclick="checkout()">إرسال للواتساب (توصيل سريع) 🏎️</button>
    </div>
</div>

<script>
    let cart = [];
    let total = 0;

    function buy(name, price) {
        cart.push({name, price});
        update();
        // انيميشن بسيط
        document.querySelector('.cart-icon').style.transform = 'scale(1.2)';
        setTimeout(() => document.querySelector('.cart-icon').style.transform = 'scale(1)', 200);
    }

    function update() {
        document.getElementById('cart-count').innerText = cart.length;
        let html = ''; total = 0;
        cart.forEach((it, i) => {
            total += it.price;
            html += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span>${it.name}</span>
                        <span>${it.price}ج <i class="fas fa-times" onclick="remove(${i})" style="color:red; margin-right:10px; cursor:pointer"></i></span>
                     </div>`;
        });
        document.getElementById('cartItems').innerHTML = html;
        document.getElementById('total').innerText = total;
    }

    function remove(i) { cart.splice(i,1); update(); }
    function openCart() { let m = document.getElementById('cartModal'); m.style.display = (m.style.display == 'block') ? 'none' : 'block'; }

    function checkout() {
        let n = document.getElementById('uName').value;
        let p = document.getElementById('uPhone').value;
        let a = document.getElementById('uAddr').value;
        if(!n || !a) { alert('الاسم والعنوان يا هندسة!'); return; }

        let msg = `*طلب جديد من مطعم توستا* 🍔%0A%0A*العميل:* ${n}%0A*الموبايل:* ${p}%0A*العنوان:* ${a}%0A%0A*الطلبات:*%0A`;
        cart.forEach(it => msg += `- ${it.name}: ${it.price}ج%0A`);
        msg += `%0A*الإجمالي:* ${total} جنيه`;

        window.open(`https://wa.me/201030353060?text=${msg}`);
    }

    function scrollToCat(id) { document.getElementById(id).scrollIntoView({behavior: 'smooth'}); }
</script>
</body>
</html>
