<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tosta • توستا | النموذج النهائي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body {
      background: #000000;
      margin: 0; padding: 0;
      position: relative;
    }
    /* ووترمارك */
    body::before {
      content: 'TOSTA';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
      font-family: 'Playfair Display', serif;
      font-size: 15vw;
      font-weight: 700;
      color: rgba(255,255,255,0.015);
      pointer-events: none;
      z-index: 0;
      letter-spacing: 20px;
    }
    .glass {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(201, 168, 76, 0.3);
    }
    .card-solid {
      background: #000000;
      border: 2px solid #c9a84c;
      transition: all 0.4s ease;
      position: relative;
      z-index: 1;
      border-radius: 0;
    }
    .card-solid:hover {
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.5), 0 15px 30px rgba(0,0,0,0.8);
      transform: translateY(-6px);
    }
    .card-solid::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 4px;
      background: #c9a84c;
      box-shadow: 0 0 15px #c9a84c;
    }
    .price-circle {
      background: #c9a84c;
      color: #000;
      font-weight: 800;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 25px rgba(201, 168, 76, 0.6);
    }
    .gold-text { color: #c9a84c; }
    .btn-primary {
      background: #c9a84c;
      color: #000;
      font-weight: 700;
      border: none;
      transition: all 0.3s ease;
      border-radius: 0;
      letter-spacing: 1px;
    }
    .btn-primary:hover {
      background: #fff;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.7);
    }
    .tab {
      color: #888;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 17px;
      padding: 12px 20px;
      border-radius: 0;
    }
    .tab.active {
      color: #c9a84c;
      border-bottom-color: #c9a84c;
      font-weight: 800;
    }
    .cart-badge {
      background: #c9a84c;
      color: #000;
      font-weight: 800;
      font-size: 10px;
      min-width: 20px;
      height: 20px;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 0; }
    .input-elegant {
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 0;
      transition: all 0.3s ease;
    }
    .input-elegant:focus {
      outline: none;
      border-color: #c9a84c;
      background: #1a1a1a;
    }
    .toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(-150px);
      background: #000;
      border: 2px solid #c9a84c;
      color: #c9a84c;
      padding: 14px 28px;
      font-weight: 700;
      z-index: 999;
      transition: transform 0.4s ease;
      border-radius: 0;
      font-size: 15px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
    .pulse { animation: pulse 0.4s ease; }
    .grid-separator {
      border-right: 1px solid rgba(201,168,76,0.2);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    /* أنيميشن دخول الكروت */
    .card-animate {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.6s ease forwards;
    }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body class="text-gray-100 min-h-screen antialiased">

  <!-- TOAST -->
  <div id="toast" class="toast">✅ تمت الإضافة للسلة</div>

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 glass">
    <div class="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- لوجو -->
        <div class="w-10 h-10 rounded-full bg-black border-2 border-[#c9a84c] flex items-center justify-center" style="box-shadow: 0 0 15px rgba(201,168,76,0.4);">
          <span style="font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700;" class="text-xl gold-text">T</span>
        </div>
        <span class="text-xl font-extrabold tracking-wider gold-text">TOSTA</span>
      </div>
      <button id="cartToggleBtn" class="relative p-2 hover:bg-white/5 transition">
        <i class="fas fa-shopping-bag text-xl text-gray-300"></i>
        <span id="cartCountBadge" class="cart-badge absolute -top-1 -right-1 rounded-full items-center justify-center hidden">0</span>
      </button>
    </div>
    <div class="max-w-6xl mx-auto px-5 pb-3 flex gap-4 overflow-x-auto">
      <button class="tab active whitespace-nowrap">🍟 كريب</button>
      <button class="tab whitespace-nowrap">🍕 بيتزا</button>
      <button class="tab whitespace-nowrap">🥮 فطير</button>
      <button class="tab whitespace-nowrap">🍗 وجبات</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-12 pb-40 relative z-10">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold gold-text mb-2">الكريب</h2>
      <p class="text-sm text-gray-400">عادي / كونو</p>
      <div style="background: #c9a84c; height: 2px; width: 60px; margin: 15px auto 0;"></div>
    </div>

    <!-- شبكة الكروت -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <!-- كارت واحد -->
      <div class="card-solid card-animate" style="animation-delay: 0.1s;">
        <div class="relative h-48 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600&h=400&fit=crop" alt="بطاطس" class="w-full h-full object-cover">
          <div class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/70 flex items-center justify-center text-sm">🍟</div>
        </div>
        <div class="p-6 flex flex-col gap-4">
          <h3 class="text-2xl font-extrabold text-white">بطاطس</h3>
          <p class="text-sm text-gray-400 -mt-2">فريش • مقرمشة</p>
          <div class="flex items-center gap-4 mt-2">
            <div class="price-circle">60</div>
            <span class="text-gray-500 text-lg">—</span>
            <div class="price-circle">70</div>
          </div>
          <div class="flex items-center gap-3 mt-2">
            <button onclick="changeQty(-1)" class="w-10 h-10 border border-gray-600 text-white hover:bg-white hover:text-black transition font-bold text-lg">−</button>
            <span id="qtyDisplay" class="text-xl font-bold gold-text w-8 text-center">1</span>
            <button onclick="changeQty(1)" class="w-10 h-10 border border-gray-600 text-white hover:bg-white hover:text-black transition font-bold text-lg">+</button>
          </div>
          <button onclick="addToCart()" class="btn-primary w-full py-3 text-base mt-2">
            أضف للطلب <i class="fas fa-plus mr-2"></i>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- زرار الرجوع للأعلى -->
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="fixed bottom-24 right-5 w-12 h-12 bg-black border-2 border-[#c9a84c] text-[#c9a84c] rounded-none flex items-center justify-center text-xl z-30 hover:bg-[#c9a84c] hover:text-black transition shadow-lg" style="box-shadow:0 0 20px rgba(201,168,76,0.4);">⬆</button>

  <!-- سلة عائمة -->
  <div id="floatingCart" class="fixed bottom-0 left-0 right-0 z-40 glass p-5 hidden max-w-6xl mx-auto">
    <div class="flex justify-between mb-3"><span class="font-bold text-white">الطلبات</span><button id="closeCartBtn" class="text-gray-500">✕</button></div>
    <div id="cartItemsList" class="max-h-40 overflow-y-auto text-sm mb-3"><p class="text-gray-500">لا طلبات</p></div>
    <div class="flex justify-between"><span>الإجمالي</span><span id="cartTotalPrice" class="gold-text font-bold">0 ج</span></div>
    <div class="flex justify-between mt-1"><span class="text-gray-500">التوصيل</span><span class="text-gray-500">15 ج</span></div>
    <div class="flex justify-between border-t border-white/10 pt-2 mt-2"><span class="text-white font-bold">النهائي</span><span id="cartFinalPrice" class="gold-text text-xl font-bold">0 ج</span></div>
    <button id="checkoutBtn" class="btn-primary w-full mt-4 py-3 disabled:opacity-30" disabled>تأكيد الطلب</button>
  </div>

  <!-- فوتر -->
  <footer class="border-t border-[#c9a84c] py-6 px-5 text-center text-gray-500 text-sm relative z-10">
    <div class="flex flex-wrap justify-center gap-6">
      <span><i class="fas fa-map-marker-alt gold-text ml-1"></i> شارع المطاعم، القاهرة</span>
      <span><i class="fas fa-phone gold-text ml-1"></i> 01030353060</span>
      <span><i class="fas fa-clock gold-text ml-1"></i> 11 ص - 2 ص</span>
    </div>
  </footer>

  <script>
    let qty = 1;
    function changeQty(d) { qty = Math.max(1, qty+d); document.getElementById('qtyDisplay').textContent = qty; }
    let cart = [];
    function updateUI() {
      let t=0; cart.forEach(i=>t+=i.price*i.qty);
      document.getElementById('cartTotalPrice').textContent = t+' ج';
      document.getElementById('cartFinalPrice').textContent = (t+15)+' ج';
      document.getElementById('cartCountBadge').textContent = cart.reduce((s,i)=>s+i.qty,0);
    }
    function addToCart() {
      cart.push({name:'بطاطس',price:60,type:'عادي',qty});
      qty=1; document.getElementById('qtyDisplay').textContent='1';
      updateUI();
      document.getElementById('floatingCart').classList.remove('hidden');
      let toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'), 2000);
      document.getElementById('cartToggleBtn').classList.add('pulse');
      setTimeout(()=>document.getElementById('cartToggleBtn').classList.remove('pulse'),400);
    }
  </script>
</body>
</html>
