<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tosta • توستا</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body {
      background: #0a0a0a;
      background-image: 
        radial-gradient(ellipse at 30% 20%, rgba(212,175,55,0.03) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(255,0,0,0.02) 0%, transparent 60%);
    }
    
    /* Glass effect */
    .glass {
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }
    .glass-card {
      background: rgba(20, 20, 20, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.4);
      background: rgba(28, 28, 28, 0.8);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.2);
    }
    
    /* Gold subtle accent */
    .gold-text { color: #c9a84c; }
    .gold-border { border-color: rgba(201, 168, 76, 0.5); }
    .gold-line {
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      height: 1px;
    }
    
    /* Buttons */
    .btn-primary {
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }
    .btn-primary:hover {
      background: #c9a84c;
      color: #0a0a0a;
      border-color: #c9a84c;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.2);
    }
    .btn-add {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.3s ease;
    }
    .btn-add:hover {
      background: #fff;
      color: #0a0a0a;
      border-color: #fff;
    }
    
    /* Tab design */
    .tab {
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .tab.active {
      color: #c9a84c;
      border-bottom-color: #c9a84c;
    }
    .tab:hover { color: #999; }
    
    /* Cart badge */
    .cart-badge {
      background: #c9a84c;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 10px;
      min-width: 18px;
      height: 18px;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    
    /* Input style */
    .input-elegant {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      transition: all 0.3s ease;
    }
    .input-elegant:focus {
      outline: none;
      border-color: rgba(201, 168, 76, 0.5);
      background: rgba(255,255,255,0.05);
    }
    .input-elegant::placeholder { color: #555; }
  </style>
</head>
<body class="text-gray-100 min-h-screen antialiased">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 glass border-b border-white/5">
    <div class="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl font-extrabold tracking-wider gold-text">TOSTA</span>
        <span class="hidden sm:inline text-[10px] text-gray-600 tracking-[0.2em] uppercase">مطعم</span>
      </div>
      <button id="cartToggleBtn" class="relative p-2 rounded-full hover:bg-white/5 transition">
        <i class="fas fa-shopping-bag text-lg text-gray-400"></i>
        <span id="cartCountBadge" class="cart-badge absolute -top-1 -right-1 rounded-full flex items-center justify-center hidden">0</span>
      </button>
    </div>
    <!-- Tabs -->
    <div class="max-w-6xl mx-auto px-5 pb-2 flex gap-6 overflow-x-auto text-sm">
      <button class="tab active pb-2">كريب</button>
      <button class="tab pb-2">بيتزا</button>
      <button class="tab pb-2">فطير</button>
      <button class="tab pb-2">وجبات</button>
      <button class="tab pb-2">ساندوتشات</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-5 py-10 pb-40">
    
    <!-- Section Title -->
    <div class="text-center mb-10">
      <h2 class="text-3xl font-bold gold-text mb-2">الكريب</h2>
      <p class="text-sm text-gray-600">عادي / كونو</p>
      <div class="gold-line w-24 mx-auto mt-3"></div>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      
      <!-- ONE PRODUCT CARD -->
      <div class="glass-card rounded-2xl p-5">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="text-lg font-semibold text-white">بطاطس</h3>
            <span class="text-xs text-gray-600">فريش • مقرمش</span>
          </div>
          <span class="text-[10px] text-gray-500 bg-white/5 px-2 py-1 rounded-full">عادي / كونو</span>
        </div>
        
        <!-- Price -->
        <div class="flex items-baseline gap-2 mb-5">
          <span class="text-2xl font-bold text-white">60</span>
          <span class="text-sm text-gray-500">ج</span>
          <span class="text-gray-700 mx-1">—</span>
          <span class="text-2xl font-bold text-white">70</span>
          <span class="text-sm text-gray-500">ج</span>
        </div>
        
        <!-- Add Button -->
        <button onclick="addToCart('بطاطس', 60, 'عادي')" class="btn-add w-full py-3 rounded-xl text-sm font-medium tracking-wide">
          أضف للطلب
          <i class="fas fa-plus mr-2 text-xs opacity-60"></i>
        </button>
      </div>

    </div>
  </main>

  <!-- FLOATING CART -->
  <div id="floatingCart" class="fixed bottom-0 left-0 right-0 z-40 glass rounded-t-3xl p-5 hidden transition-all duration-500 max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i class="fas fa-shopping-bag gold-text"></i>
        <span class="font-bold text-white">الطلبات</span>
        <span id="cartCountInline" class="text-xs text-gray-500">(0)</span>
      </div>
      <button id="closeCartBtn" class="text-gray-600 hover:text-white transition"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItemsList" class="max-h-40 overflow-y-auto space-y-2 mb-3 text-sm">
      <p class="text-gray-600 text-center">لا توجد طلبات بعد</p>
    </div>
    <div class="flex items-center justify-between border-t border-white/5 pt-3">
      <span class="text-gray-400">الإجمالي</span>
      <span id="cartTotalPrice" class="text-xl font-bold gold-text">0 ج</span>
    </div>
    <button id="checkoutBtn" class="btn-primary w-full mt-4 py-3 rounded-xl font-semibold text-sm tracking-wide disabled:opacity-30 disabled:cursor-not-allowed" disabled>
      متابعة الطلب
    </button>
  </div>

  <!-- CHECKOUT POPUP -->
  <div id="checkoutPopup" class="fixed inset-0 z-50 flex items-center justify-center hidden" style="background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);">
    <div class="glass-card rounded-3xl p-6 w-11/12 max-w-md">
      <h2 class="text-xl font-bold text-white mb-5 text-center">إكمال البيانات</h2>
      <div class="space-y-3">
        <input type="text" id="custName" placeholder="الاسم الكريم" class="input-elegant w-full rounded-xl px-4 py-3 text-sm">
        <input type="tel" id="custPhone" placeholder="رقم الموبايل" class="input-elegant w-full rounded-xl px-4 py-3 text-sm">
        <textarea id="custAddress" rows="2" placeholder="العنوان بالتفصيل" class="input-elegant w-full rounded-xl px-4 py-3 text-sm"></textarea>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="closePopupBtn" class="flex-1 py-3 rounded-xl text-sm text-gray-500 border border-white/10 hover:text-white transition">إلغاء</button>
        <button id="sendWhatsAppBtn" class="flex-1 btn-primary py-3 rounded-xl text-sm font-semibold">إرسال للواتساب</button>
      </div>
    </div>
  </div>

  <script>
    let cart = [];
    
    function updateCartUI() {
      const cartList = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalPrice');
      const badge = document.getElementById('cartCountBadge');
      const inline = document.getElementById('cartCountInline');
      const checkoutBtn = document.getElementById('checkoutBtn');
      
      if (cart.length === 0) {
        cartList.innerHTML = '<p class="text-gray-600 text-center">لا توجد طلبات بعد</p>';
        totalSpan.textContent = '0 ج';
        badge.classList.add('hidden');
        inline.textContent = '(0)';
        checkoutBtn.disabled = true;
        return;
      }
      
      badge.classList.remove('hidden');
      badge.textContent = cart.length;
      inline.textContent = `(${cart.length})`;
      
      let total = 0;
      cartList.innerHTML = cart.map((item, i) => {
        total += item.price;
        return `
          <div class="flex items-center justify-between py-2">
            <span class="text-white text-sm">${item.name} <span class="text-gray-600 text-xs">${item.type}</span></span>
            <div class="flex items-center gap-3">
              <span class="gold-text text-sm font-semibold">${item.price} ج</span>
              <button onclick="removeFromCart(${i})" class="text-gray-600 hover:text-red-400 transition text-xs"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
      
      totalSpan.textContent = total + ' ج';
      checkoutBtn.disabled = false;
    }
    
    function addToCart(name, price, type = '') {
      cart.push({ name, price, type });
      updateCartUI();
      document.getElementById('floatingCart').classList.remove('hidden');
    }
    
    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }
    
    document.getElementById('cartToggleBtn').addEventListener('click', () => {
      document.getElementById('floatingCart').classList.toggle('hidden');
    });
    document.getElementById('closeCartBtn').addEventListener('click', () => {
      document.getElementById('floatingCart').classList.add('hidden');
    });
    
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      document.getElementById('checkoutPopup').classList.remove('hidden');
    });
    document.getElementById('closePopupBtn').addEventListener('click', () => {
      document.getElementById('checkoutPopup').classList.add('hidden');
    });
    
    document.getElementById('sendWhatsAppBtn').addEventListener('click', () => {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      if(!name||!phone||!address) { alert('من فضلك أكمل جميع البيانات'); return; }
      
      let order = cart.map((item,i)=>`${i+1}. ${item.name} (${item.type}) - ${item.price} ج`).join('%0A');
      let total = cart.reduce((s,i)=>s+i.price,0);
      let msg = `*TOSTA | طلب جديد*%0A%0A👤 ${name}%0A📞 ${phone}%0A📍 ${address}%0A%0A📋 الطلب:%0A${order}%0A%0A💰 الإجمالي: ${total} ج`;
      window.open(`https://wa.me/201030353060?text=${msg}`, '_blank');
    });
  </script>
</body>
          </html>
