<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معمل دكتور جابر شحاتة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--gold:#d4af37;
--dark:#0a192f;
--glass:rgba(255,255,255,0.08);
--wa:#25d366;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}

body{
background:radial-gradient(circle at top,#112240,#0a192f);
color:white;
overflow-x:hidden;
}

/* خلفية نجوم متحركة */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
animation:moveStars 60s linear infinite;
opacity:.15;
}

@keyframes moveStars{
from{transform:translate(0,0)}
to{transform:translate(-500px,-500px)}
}

/* شريط رمضان */
.top-bar{
background:linear-gradient(90deg,#d4af37,#b8860b);
text-align:center;
padding:10px;
font-weight:900;
color:black;
letter-spacing:1px;
}

/* الهيدر */
header{
text-align:center;
padding:60px 20px;
}

.doc-img{
width:140px;
height:140px;
border-radius:50%;
border:4px solid var(--gold);
box-shadow:0 0 40px var(--gold);
margin-bottom:20px;
animation:pulse 3s infinite;
object-fit:cover;
}

@keyframes pulse{
0%,100%{box-shadow:0 0 20px var(--gold)}
50%{box-shadow:0 0 60px var(--gold)}
}

h1{
font-size:34px;
font-weight:900;
color:var(--gold);
margin-bottom:10px;
}

.subtitle{
opacity:.8;
margin-bottom:20px;
}

.vip-btn{
background:linear-gradient(90deg,#d4af37,#b8860b);
padding:15px 35px;
border-radius:50px;
font-weight:800;
color:black;
text-decoration:none;
display:inline-block;
transition:.4s;
}

.vip-btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px var(--gold);
}

/* قسم التحاليل */
.section{
padding:40px 20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.card{
background:var(--glass);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.1);
transition:.5s;
transform-style:preserve-3d;
}

.card:hover{
transform:rotateY(5deg) rotateX(5deg) scale(1.05);
box-shadow:0 20px 40px rgba(0,0,0,.5);
}

.card h4{
margin-bottom:10px;
font-weight:700;
}

.price{
color:var(--gold);
font-weight:900;
margin-bottom:15px;
}

.order-btn{
background:var(--wa);
padding:10px;
border-radius:12px;
display:block;
text-align:center;
text-decoration:none;
color:white;
font-weight:700;
transition:.3s;
}

.order-btn:hover{
background:#1ebe5d;
}

/* فوتر */
footer{
text-align:center;
padding:40px 20px;
margin-top:40px;
opacity:.7;
}

.bottom-buttons{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
}

.bottom-buttons a{
padding:12px 25px;
border-radius:30px;
text-decoration:none;
font-weight:700;
color:white;
background:#112240;
border:1px solid var(--gold);
transition:.3s;
}

.bottom-buttons a:hover{
background:var(--gold);
color:black;
}
</style>
</head>

<body>

<div class="top-bar">
🌙 خصومات رمضان 40% على جميع التحاليل 🌙
</div>

<header>
<img src="doctor.jpg" class="doc-img">
<h1>معمل دكتور جابر شحاتة</h1>
<div class="subtitle">أبو المطامير - مساكن الإرشاد | يوميًا 9 صباحًا - 9 مساءً</div>

<a href="https://wa.me/201015090991?text=أريد طلب سحب منزلي VIP" class="vip-btn">
طلب سحب منزلي VIP
</a>
</header>

<div class="section">
<div class="grid" id="tests"></div>
</div>

<footer>
<div>جميع حقوق النشر محفوظة © 2026 معمل دكتور جابر شحاتة</div>

<div class="bottom-buttons">
<a href="tel:01015090991">اتصل بنا</a>
<a href="https://wa.me/201015090991">واتساب</a>
<a href="#">عن المعمل</a>
</div>
</footer>

<script>
const tests=[
["CBC صورة دم كاملة",120],["ESR",60],["CRP",120],["فصيلة الدم",80],
["سكر صائم",60],["سكر فاطر",60],["HbA1c",150],["تحليل بول كامل",70],
["تحليل براز كامل",70],["وظائف كبد",200],["وظائف كلى",180],["دهون كاملة",220],
["كوليسترول",90],["دهون ثلاثية",90],["HDL",90],["LDL",90],
["TSH",150],["T3",120],["T4",120],["فيتامين د",250],
["فيتامين ب12",200],["حديد",100],["Ferritin",200],["كالسيوم",90],
["مغنيسيوم",100],["حمض اليوريك",80],["تحليل حمل",80],["PSA",250],
["PT",120],["PTT",120],["INR",100],["فيروس C",250],
["فيروس B",220],["HIV",300],["ASOT",150],["RF",150],
["ANA",350],["D-Dimer",400],["Troponin",450],["تحليل سيولة",200]
];

let container=document.getElementById("tests");

tests.forEach(test=>{
container.innerHTML+=`
<div class="card">
<h4>${test[0]}</h4>
<div class="price">${test[1]} جنيه بعد الخصم</div>
<a class="order-btn" target="_blank"
href="https://wa.me/201015090991?text=أريد طلب تحليل ${encodeURIComponent(test[0])}">
اطلب الآن
</a>
</div>`;
});
</script>

</body>
</html>
