<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم BURGER - اطلب أونلاين</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ff9800;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #1e1e1e, #121212);
        }

        .banner {
            width: 90%;
            margin: 10px auto;
            background: var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            text-align: right;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            position: relative;
            transition: 0.3s;
        }

        .card img {
            width: 100%;
            height: auto;
            margin-top: -30px; /* لحركة خروج الصورة من الكارت */
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        .card h3 { margin: 10px 0 5px; font-size: 16px; }
        .card p { color: #4caf50; font-weight: bold; margin: 5px 0; }

        .add-btn {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #1e1e1e;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
        }

        .send-btn {
            background: #25d366;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>BURGER <span style="color:var(--primary-color)">SHOP</span></h1>
</header>

<div class="banner">
    <h2>عرض الويك إند! 🔥</h2>
    <p>خصم 20% على أي ساندوتش دبل</p>
</div>

<div class="menu-grid">
    <div class="card">
        <img src="burger-image.png" alt="برجر"> <h3>بيج برجر دبل</h3>
        <p>150 EGP</p>
        <button class="add-btn" onclick="addToCart('بيج برجر دبل', 150)">أضف للسلة</button>
    </div>

    <div class="card">
        <img src="burger2.png" alt="برجر">
        <h3>تشيز برجر</h3>
        <p>120 EGP</p>
        <button class="add-btn" onclick="addToCart('تشيز برجر', 120)">أضف للسلة</button>
    </div>
</div>

<div class="cart-bar">
    <div id="cart-info">السلة: 0 ج.م</div>
    <a href="#" class="send-btn" onclick="sendWhatsApp()">اطلب الآن (واتساب)</a>
</div>

<script>
    let cart = [];
    let total = 0;

    function addToCart(name, price) {
        cart.push(name);
        total += price;
        document.getElementById('cart-info').innerText = `السلة: ${total} ج.م`;
        alert(name + " اتضاف للسلة يا وحش!");
    }

    function sendWhatsApp() {
        if (cart.length === 0) return alert("السلة فاضية!");
        let phone = "2010XXXXXXXX"; // حط رقم المطعم هنا
        let message = "طلب جديد من البرنامج:\n" + cart.join("\n") + "\n\nالإجمالي: " + total + " ج.م";
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`);
    }
</script>

</body>
</html>
